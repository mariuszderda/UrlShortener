services:

  db:
    image: postgres:latest
    restart: always
    container_name: url-shortener-database
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example_password
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  read-service:
    build: ./readService/
    ports:
      - 8082:8082
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/urlshortener
      DB_USERNAME: postgres
      DB_PASSWORD: example_password

  write-service:
    build: ./writeService/
    ports:
      - 8081:8081
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/urlshortener
      DB_USERNAME: postgres
      DB_PASSWORD: example_password

volumes:
  pgdata: