spring.application.name=cleanup-service

# Cassandra — te same zmienne co w pozostałych serwisach
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS}
spring.cassandra.port=${CASSANDRA_PORT}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE}
spring.cassandra.schema-action=none

# Cleanup config
cleanup.strategy=last-used
cleanup.ttl-days=90
cleanup.schedule=0 * * * * *

server.port=8083